AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Orders API - Cognito auth, WAF rate limiting, Lambda writer, direct API Gateway to DynamoDB reader, global table, X-Ray and dashboard

Parameters:
  ApiName:
    Type: String
    Default: orders-api
    Description: Name of the REST API (also used as the ApiName dimension in the dashboard)
  RateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    Description: Max requests per client IP per 5 minutes before WAF blocks (WAF minimum is 10)
  ReplicaRegion:
    Type: String
    Default: eu-west-1
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
    Description: Secondary AWS Region for the DynamoDB global table replica (must differ from the stack's Region)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    Tracing: Active            # AWS X-Ray; SAM also adds the X-Ray write permissions to the role

Resources:
  # ------------------------------------------------- DynamoDB global table
  # A global table replicates every write to the replica Region (disaster recovery,
  # multi-Region availability). Streams are required by global tables.
  # No TableName on purpose: a fixed name would clash with the table this replaces.
  OrdersGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Replicas:
        - Region: !Ref AWS::Region      # primary (this stack's Region)
        - Region: !Ref ReplicaRegion    # secondary (disaster recovery)

  # ----------------------------------------------------------------- Cognito
  OrdersUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: orders-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  OrdersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OrdersUserPool
      ClientName: orders-app-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH   # convenient for CLI testing; prefer SRP in real clients
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # -------------------------------------- IAM role for the direct integration
  # API Gateway assumes this role to call DynamoDB. Read-only, one table.
  ApiDynamoDbReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: QueryOrdersTable
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt OrdersGlobalTable.Arn

  # ------------------------------------------------------------- REST API
  # GET  /orders/{orderId}  -> DynamoDB Query directly (no Lambda), defined below
  # POST /orders            -> Lambda, added by SAM from the function's Api event
  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Ref ApiName
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt OrdersUserPool.Arn
      DefinitionBody:
        swagger: '2.0'
        info:
          title: !Ref ApiName
          version: '1.0'
        paths:
          "/orders/{orderId}":
            get:
              summary: Get all items of an order (API Gateway calls DynamoDB directly)
              produces:
                - application/json
              parameters:
                - name: orderId
                  in: path
                  required: true
                  type: string
              security:
                - CognitoAuthorizer: []
              responses:
                '200':
                  description: Items of the order
                '400':
                  description: Bad request
                '500':
                  description: Server error
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/Query"
                credentials: !GetAtt ApiDynamoDbReadRole.Arn
                passthroughBehavior: when_no_templates
                # Request mapping: path parameter -> DynamoDB Query request body.
                # escapeJavaScript + replaceAll keeps the value a valid JSON string.
                requestTemplates:
                  application/json: !Sub |
                    {
                      "TableName": "${OrdersGlobalTable}",
                      "KeyConditionExpression": "orderId = :orderId",
                      "ExpressionAttributeValues": {
                        ":orderId": { "S": "$util.escapeJavaScript($input.params('orderId')).replaceAll("\\'","'")" }
                      }
                    }
                responses:
                  # Response mapping: DynamoDB JSON ({"qty":{"N":"2"}}) -> plain JSON ({"qty":2}).
                  # Handles S, N and BOOL attributes; other types (L, M, SS, ...) are returned as null.
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($root = $input.path('$'))
                        {
                          "orderId": "$util.escapeJavaScript($input.params('orderId')).replaceAll("\\'","'")",
                          "count": $root.Count,
                          "items": [
                        #foreach($item in $root.Items)
                        #if($foreach.count > 1),#end
                            {
                        #foreach($attr in $item.keySet())
                        #set($v = $item.get($attr))
                        #if($foreach.count > 1),#end
                        #if("$!v.S" != "")
                              "$util.escapeJavaScript($attr).replaceAll("\\'","'")": "$util.escapeJavaScript($v.S).replaceAll("\\'","'")"
                        #elseif("$!v.N" != "")
                              "$util.escapeJavaScript($attr).replaceAll("\\'","'")": $v.N
                        #elseif("$!v.BOOL" != "")
                              "$util.escapeJavaScript($attr).replaceAll("\\'","'")": $v.BOOL
                        #{else}
                              "$util.escapeJavaScript($attr).replaceAll("\\'","'")": null
                        #end
                        #end
                            }
                        #end
                          ]
                        }
                  '4\d{2}':
                    statusCode: '400'
                    responseTemplates:
                      application/json: '{"message": "Bad request"}'
                  '5\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "Internal error"}'

  # --------------------------------------------------------------- Lambda
  # Writer function. Bundled with esbuild (minified, AWS SDK left out because the
  # Node.js 22 runtime already provides it), so the package is a few KB.
  SaveOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: true
        Target: es2022
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        External:
          - '@aws-sdk/*'
    Properties:
      CodeUri: src/
      Handler: app.handler
      Description: Saves an order item to the Orders global table
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersGlobalTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OrdersGlobalTable.Arn
      Events:
        SaveOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: post          # protected by the default Cognito authorizer

  # ------------------------------------------------------------------ WAF
  OrdersWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: orders-api-web-acl
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: OrdersApiWebAcl
      Rules:
        - Name: RateLimitPerIp
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp

  OrdersWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${OrdersApi}/stages/${OrdersApi.Stage}"
      WebACLArn: !GetAtt OrdersWebAcl.Arn

  # ------------------------------------------------------------ Dashboard
  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-orders"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway: Count and 4XXError",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${ApiName}"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${ApiName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: Invocations and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${SaveOrderFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${SaveOrderFunction}"]
                ]
              }
            }
          ]
        }

Outputs:
  OrdersTableName:
    Description: Name of the global table (same name in every replica Region)
    Value: !Ref OrdersGlobalTable
  OrdersTableStreamArn:
    Value: !GetAtt OrdersGlobalTable.StreamArn
  ReplicaRegion:
    Value: !Ref ReplicaRegion
  SaveOrderApiUrl:
    Description: POST here (Lambda)
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders"
  GetOrderApiUrl:
    Description: GET here, replace ORDER_ID (direct DynamoDB integration)
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders/ORDER_ID"
  UserPoolId:
    Value: !Ref OrdersUserPool
  UserPoolClientId:
    Value: !Ref OrdersUserPoolClient
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-orders"
